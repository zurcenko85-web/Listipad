<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0f08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🍂 Листопад</title>
<style>
  /* ================= СБРОС СТИЛЕЙ И БАЗОВЫЕ НАСТРОЙКИ ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden; /* Запрещаем скролл страницы */
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a0f08;
    user-select: none; /* Запрещаем выделение текста */
    -webkit-user-select: none;
    touch-action: none; /* Отключаем стандартные жесты браузера (зум, скролл) */
    overscroll-behavior: none;
    position: fixed;
    width: 100%;
  }

  /* ================= CANVAS (ИГРОВОЕ ПОЛЕ) ================= */
  canvas {
    display: block;
    position: absolute;
    inset: 0; /* Растягиваем на весь экран */
    z-index: 2;
    touch-action: none;
  }

  /* ================= ВЕРХНИЙ ИНТЕРФЕЙС (ОЧКИ, ЖИЗНИ, ПАУЗА) ================= */
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    /* Отступ сверху учитывает "чёлку" (safe-area) на современных телефонах */
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none; /* Чтобы клики проходили сквозь контейнер */
    color: #fff3e0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    gap: 10px;
  }

  .stat {
    background: rgba(60, 30, 15, 0.5);
    backdrop-filter: blur(10px); /* Размытие фона под плашкой */
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 200, 140, 0.3);
    padding: 8px 16px;
    border-radius: 16px;
    font-size: 13px;
    letter-spacing: 0.8px;
    font-weight: 600;
  }

  .stat b {
    display: block;
    font-size: 24px;
    color: #ffcf8a;
    margin-top: 2px;
    font-weight: 800;
  }

  /* Отображение жизней (сердечки) */
  #livesDisplay {
    font-size: 18px !important;
    letter-spacing: 2px;
    line-height: 1.2;
  }

  /* Кнопка паузы (большая, для пальца) */
  #pauseBtn {
    pointer-events: auto; /* Возвращаем кликабельность кнопке */
    background: rgba(60, 30, 15, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 200, 140, 0.4);
    color: #ffcf8a;
    width: 72px;
    height: 72px;
    border-radius: 20px;
    font-size: 32px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #pauseBtn:active {
    transform: scale(0.92); /* Эффект нажатия */
    background: rgba(255, 180, 100, 0.35);
  }

  /* ================= КОМБО (ВСПЛЫВАЮЩИЙ ТЕКСТ) ================= */
  #combo {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) scale(0); /* Изначально спрятан */
    font-size: 48px;
    font-weight: 900;
    color: #ffb347;
    text-shadow: 0 0 25px rgba(255, 160, 60, 1), 0 4px 12px rgba(0,0,0,0.7);
    z-index: 10;
    pointer-events: none;
    transition: transform 0.15s cubic-bezier(.17,.89,.32,1.49); /* Пружинистое появление */
    white-space: nowrap;
  }
  #combo.show { transform: translateX(-50%) scale(1); } /* Класс для показа */

  /* ================= OVERLAY (ЭКРАНЫ МЕНЮ И КОНЦА ИГРЫ) ================= */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    background: rgba(30, 15, 8, 0.78);
    backdrop-filter: blur(12px); /* Сильное размытие игры на фоне */
    -webkit-backdrop-filter: blur(12px);
    color: #fff3e0;
    text-align: center;
    padding: 24px;
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; } /* Скрываем оверлей */

  #overlay h1 {
    font-size: clamp(44px, 12vw, 80px);
    background: linear-gradient(135deg, #ffcf8a, #ff8c42, #d94f1e);
    -webkit-background-clip: text; /* Делаем текст градиентным */
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    letter-spacing: 3px;
    font-weight: 900;
  }

  #overlay p {
    font-size: 17px;
    max-width: 480px;
    line-height: 1.6;
    opacity: 0.92;
    margin-bottom: 28px;
  }

  #overlay .score-final {
    font-size: 22px;
    color: #ffcf8a;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* ================= БОЛЬШИЕ КНОПКИ ДЕЙСТВИЙ ================= */
  button {
    pointer-events: auto;
    padding: 20px 56px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #3a1d0d;
    background: linear-gradient(135deg, #ffcf8a, #ff9a4a);
    border: none;
    border-radius: 60px;
    cursor: pointer;
    box-shadow: 0 10px 34px rgba(255, 140, 60, 0.55);
    transition: transform 0.15s, box-shadow 0.15s;
    margin: 10px;
    min-width: 260px;
    font-family: inherit;
  }
  button:active {
    transform: scale(0.96);
    box-shadow: 0 6px 20px rgba(255, 140, 60, 0.7);
  }

  .btn-secondary {
    background: rgba(255, 200, 140, 0.16);
    color: #ffcf8a;
    border: 2px solid rgba(255, 200, 140, 0.5);
    box-shadow: none;
    font-size: 19px;
    padding: 16px 44px;
    min-width: 240px;
  }
  .btn-secondary:active {
    background: rgba(255, 200, 140, 0.3);
  }

  #pauseMenu h1 {
    font-size: clamp(36px, 9vw, 64px);
    margin-bottom: 32px;
  }

  .pause-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  /* ================= ИНДИКАТОР ВЕТРА ================= */
  #wind {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    right: 20px;
    z-index: 10;
    color: rgba(255, 243, 224, 0.75);
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    pointer-events: none;
    background: rgba(60, 30, 15, 0.45);
    padding: 8px 14px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }

  /* ================= КНОПКА ЗВУКА ================= */
  #soundToggle {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: 20px;
    z-index: 10;
    pointer-events: auto;
    background: rgba(60, 30, 15, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 200, 140, 0.4);
    color: #ffcf8a;
    width: 64px;
    height: 64px;
    border-radius: 18px;
    font-size: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.15s;
  }
  #soundToggle:active {
    transform: scale(0.92);
    background: rgba(255, 180, 100, 0.35);
  }

  /* ================= АДАПТАЦИЯ ПОД ГОРИЗОНТАЛЬНЫЙ ЭКРАН (LANDSCAPE) ================= */
  @media (orientation: landscape) and (max-height: 500px) {
    #ui { padding: 8px 12px; }
    .stat { padding: 6px 12px; font-size: 11px; }
    .stat b { font-size: 18px; }
    #pauseBtn { width: 56px; height: 56px; font-size: 24px; border-radius: 16px; }
    #soundToggle { width: 50px; height: 50px; font-size: 22px; border-radius: 14px; }
    #overlay h1 { font-size: 42px; margin-bottom: 8px; }
    #overlay p { font-size: 14px; margin-bottom: 16px; }
    button { padding: 14px 36px; font-size: 18px; min-width: 200px; margin: 6px; }
    .btn-secondary { padding: 12px 30px; font-size: 16px; min-width: 180px; }
    #combo { font-size: 36px; top: 80px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Верхняя панель -->
<div id="ui">
  <div class="stat">ОЧКИ <b id="score">0</b></div>
  <div style="display:flex; gap:10px; align-items:flex-start;">
    <div class="stat">ЖИЗНИ <b id="livesDisplay">❤❤❤</b></div>
    <button id="pauseBtn" title="Пауза">⏸</button>
  </div>
</div>

<div id="combo"></div>

<div id="wind">🍃 <span id="windDir">—</span></div>

<button id="soundToggle" title="Звук">🔊</button>

<!-- Экран приветствия -->
<div id="overlay">
  <h1>ЛИСТОПАД</h1>
  <p>Лови осенние листья корзинкой. Собирай комбо за подряд!<br>
  ⚠️ Избегай колючих каштанов — они отнимают жизнь.</p>
  <p style="font-size:14px; opacity:0.7;">👆 Ведите пальцем по экрану<br>
  ⏸ Esc или Пробел — пауза</p>
  <button id="startBtn">НАЧАТЬ</button>
</div>

<script>
// Оборачиваем весь код в IIFE (Immediately Invoked Function Expression), 
// чтобы переменные не засоряли глобальную область видимости.
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;

  // Функция для адаптации холста под размер экрана (с учетом Retina-дисплеев)
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2); // Ограничиваем DPR до 2 для производительности
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    
    // Масштабируем контекст, чтобы рисовать в обычных координатах
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    generateLandscape(); // Пересоздаем пейзаж при изменении размера
  }

  // ============================================================
  // ==== АУДИО-ДВИЖОК (Web Audio API) ====
  // ============================================================
  // Создает фоновую музыку и шум ветра процедурно (без mp3 файлов)
  const audioEngine = {
    ctx: null, master: null, musicGain: null, windGain: null,
    enabled: true, started: false,
    windSource: null, windLfo: null,
    melodyIndex: 0, scheduleTimer: null,

    // Частоты нот для генерации аккордов (A minor, F major, C major, G major)
    noteFreq: {
      A2: 110.00, C3: 130.81, E3: 164.81,
      F2: 87.31,  A2b: 103.83, C3b: 123.47,
      C3s: 138.59, E3s: 155.56, G3s: 185.00,
      G2: 98.00,  B2: 123.47, D3: 146.83,
      E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25
    },

    // Инициализация аудио-контекста (вызывается при первом клике)
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();

      // Главный регулятор громкости
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.0; // Начинаем с 0 и плавно повышаем
      this.master.connect(this.ctx.destination);

      // Громкость музыки
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 1.0;
      this.musicGain.connect(this.master);

      // Громкость ветра
      this.windGain = this.ctx.createGain();
      this.windGain.gain.value = 0.04;
      this.windGain.connect(this.master);

      // Создаем эффект эха (Delay)
      const delay = this.ctx.createDelay(0.5);
      delay.delayTime.value = 0.25;
      const feedback = this.ctx.createGain();
      feedback.gain.value = 0.3;
      const wet = this.ctx.createGain();
      wet.gain.value = 0.25;

      this.musicGain.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(this.master);
    },

    // Воспроизведение одной ноты (осциллятора)
    playNote(freq, time, duration, volume, isBass = false) {
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      osc1.type = 'sine';
      osc1.frequency.value = freq;
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2; // Добавляем обертон

      // Огибающая громкости (атака и затухание)
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(volume, time + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);

      // Фильтр низких частот для мягкости звука
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(isBass ? 800 : 2000, time);
      filter.frequency.exponentialRampToValueAtTime(isBass ? 400 : 1000, time + duration);
      filter.Q.value = 0.5;

      const osc2Gain = this.ctx.createGain();
      osc2Gain.gain.value = 0.15;

      osc1.connect(gain);
      osc2.connect(osc2Gain);
      osc2Gain.connect(gain);
      gain.connect(filter);
      filter.connect(this.musicGain);

      osc1.start(time); osc2.start(time);
      osc1.stop(time + duration + 0.1);
      osc2.stop(time + duration + 0.1);
    },

    // Генерация музыкальной фразы (аккорд + арпеджио + мелодия)
    schedulePhrase() {
      if (!this.started || !this.enabled) return;
      const t = this.ctx.currentTime + 0.05;
      const phrase = this.melodyIndex % 4; // Циклично проходим 4 аккорда
      let bass, chordNotes, melody;

      // Выбираем аккорд и ноты для мелодии
      switch(phrase) {
        case 0: // Am
          bass = this.noteFreq.A2;
          chordNotes = [this.noteFreq.E3, this.noteFreq.A2 * 2, this.noteFreq.C3 * 2];
          melody = [this.noteFreq.E4, this.noteFreq.G4, this.noteFreq.A4, this.noteFreq.B4];
          break;
        case 1: // F
          bass = this.noteFreq.F2;
          chordNotes = [this.noteFreq.C3, this.noteFreq.F2 * 2, this.noteFreq.A2b * 2];
          melody = [this.noteFreq.A4, this.noteFreq.G4, this.noteFreq.F4, this.noteFreq.E4];
          break;
        case 2: // C
          bass = this.noteFreq.C3;
          chordNotes = [this.noteFreq.G3s, this.noteFreq.C3 * 2, this.noteFreq.E3s * 2];
          melody = [this.noteFreq.E4, this.noteFreq.F4, this.noteFreq.G4, this.noteFreq.E4];
          break;
        case 3: // G
          bass = this.noteFreq.G2;
          chordNotes = [this.noteFreq.D3, this.noteFreq.G2 * 2, this.noteFreq.B2 * 2];
          melody = [this.noteFreq.D5, this.noteFreq.C5, this.noteFreq.B4, this.noteFreq.A4];
          break;
      }

      // Играем бас
      this.playNote(bass, t, 2.8, 0.45, true);
      
      // Играем арпеджио (перебор аккорда)
      for (let i = 0; i < 6; i++) {
        this.playNote(chordNotes[i % chordNotes.length], t + i * 0.45, 0.6, 0.16, true);
      }
      
      // Играем мелодию поверх
      melody.forEach((note, i) => {
        this.playNote(note, t + 0.2 + i * 0.7, 0.8, 0.28, false);
      });

      this.melodyIndex++;
      // Планируем следующую фразу через 2.8 секунды
      this.scheduleTimer = setTimeout(() => this.schedulePhrase(), 2800);
    },

    // Создание звука ветра (белый шум + фильтрация)
    startWind() {
      const bufferSize = 2 * this.ctx.sampleRate;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      // Заполняем буфер случайными числами (белый шум)
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      this.windSource = this.ctx.createBufferSource();
      this.windSource.buffer = buffer;
      this.windSource.loop = true; // Зацикливаем

      // Полосовой фильтр, чтобы шум звучал как ветер, а не как шипение
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 400;
      filter.Q.value = 0.8;

      // Медленная модуляция громкости (LFO) для эффекта порывов ветра
      const lfoGain = this.ctx.createGain();
      lfoGain.gain.value = 0.03;
      this.windLfo = this.ctx.createOscillator();
      this.windLfo.frequency.value = 0.15; // Очень медленно
      this.windLfo.connect(lfoGain);
      lfoGain.connect(this.windGain.gain);
      this.windLfo.start();

      this.windSource.connect(filter);
      filter.connect(this.windGain);
      this.windSource.start();
    },

    // Запуск аудио
    start() {
      this.init();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      if (this.started) return;
      this.started = true;
      
      // Плавно повышаем общую громкость за 4 секунды
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(0.35, this.ctx.currentTime + 4);
      
      this.startWind();
      setTimeout(() => this.schedulePhrase(), 500);
    },

    // Включение/выключение звука
    toggle() {
      if (!this.ctx) { this.enabled = !this.enabled; return; }
      this.enabled = !this.enabled;
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.linearRampToValueAtTime(
        this.enabled ? 0.35 : 0,
        this.ctx.currentTime + 1
      );
      if (!this.enabled && this.scheduleTimer) clearTimeout(this.scheduleTimer);
      else if (this.enabled && this.started) this.schedulePhrase();
    }
  };

  // ============================================================
  // ==== ГЕНЕРАЦИЯ ПЕЙЗАЖА (ФОН) ====
  // ============================================================
  let hills = [], bgTrees = [], clouds = [];

  function generateLandscape() {
    // Генерация холмов (4 слоя с разной прозрачностью для глубины)
    hills = [];
    const layers = [
      { color: '#5c3a2e', yBase: 0.55, amp: 40, count: 5, alpha: 0.55 },
      { color: '#4a2a1e', yBase: 0.65, amp: 55, count: 4, alpha: 0.7 },
      { color: '#3a1f14', yBase: 0.78, amp: 70, count: 3, alpha: 0.85 },
      { color: '#2a1409', yBase: 0.92, amp: 50, count: 3, alpha: 1.0 }
    ];
    
    layers.forEach((layer, li) => {
      const pts = [];
      const seed = li * 137;
      for (let i = 0; i <= layer.count; i++) {
        const t = i / layer.count;
        const x = t * W;
        // Используем синусоиды для создания естественных неровностей
        const noise = Math.sin(seed + i * 1.7) * 0.5 + Math.sin(seed * 2 + i * 3.3) * 0.3;
        pts.push({ x, y: H * layer.yBase - noise * layer.amp });
      }
      hills.push({ ...layer, points: pts });
    });

    // Генерация деревьев на заднем плане
    bgTrees = [];
    const treeCount = Math.max(4, Math.floor(W / 200));
    for (let i = 0; i < treeCount; i++) {
      const x = (i + 0.5) * (W / treeCount) + (Math.random() - 0.5) * 60;
      const baseY = H * (0.72 + Math.random() * 0.08);
      const h = 100 + Math.random() * 120;
      const crownR = 40 + Math.random() * 35;
      const hue = Math.random();
      // Случайный оттенок осенней листвы
      const color = hue < 0.4 ? 'rgba(120, 50, 25, 0.75)' :
                    hue < 0.75 ? 'rgba(150, 70, 30, 0.75)' :
                                 'rgba(100, 45, 20, 0.75)';
      bgTrees.push({ x, baseY, h, crownR, color });
    }

    // Генерация облаков
    clouds = [];
    for (let i = 0; i < 4; i++) {
      clouds.push({
        x: Math.random() * W,
        y: 60 + Math.random() * (H * 0.2),
        w: 180 + Math.random() * 180,
        h: 40 + Math.random() * 25,
        speed: 4 + Math.random() * 8,
        alpha: 0.15 + Math.random() * 0.15
      });
    }
  }

  // Первичная настройка и подписка на изменение размера окна
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  // ============================================================
  // ==== СОСТОЯНИЕ ИГРЫ ====
  // ============================================================
  const state = {
    running: false,   // Идет ли игра
    paused: false,    // На паузе ли
    score: 0,         // Текущий счет
    lives: 3,         // Жизни
    combo: 0,         // Текущее комбо
    bestCombo: 0,     // Лучшее комбо за игру
    time: 0,          // Время игры (для сложности)
    wind: 0,          // Сила и направление ветра (-1 до 1)
    windTimer: 0,     // Таймер до смены ветра
    spawnTimer: 0,    // Таймер до спавна следующего объекта
    spawnInterval: 0.45, // Базовый интервал спавна
    difficulty: 0     // Уровень сложности (0-3)
  };

  // Корзина игрока
  const BASKET = { x: 0, y: 0, w: 130, h: 80, targetX: 0, tilt: 0 };

  // Массивы для объектов
  const leaves = [], hazards = [], particles = [], ambientLeaves = [];

  // Цвета осенних листьев (пары: основной и тёмный оттенок)
  const LEAF_COLORS = [
    ['#ffb347', '#ff8c42'], ['#e74c3c', '#c0392b'],
    ['#f4d03f', '#d4a017'], ['#d35400', '#a04000'],
    ['#c98a3a', '#8b5a2b']
  ];

  function randomLeafColor() {
    return LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0];
  }

  // Базовые скорости падения
  const BASE_LEAF_SPEED = 140;
  const BASE_HAZARD_SPEED = 170;

  // Создание игрового листа (за который дают очки)
  function spawnLeaf() {
    const size = 24 + Math.random() * 18;
    const [c1, c2] = randomLeafColor();
    leaves.push({
      x: Math.random() * (W - 80) + 40,
      y: -60,
      vx: (Math.random() - 0.5) * 50,
      vy: BASE_LEAF_SPEED + Math.random() * 80 + state.difficulty * 25,
      size, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 4,
      swayAmp: 20 + Math.random() * 40, // Амплитуда покачивания
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 1 + Math.random() * 1.5,
      color1: c1, color2: c2, alive: true
    });
  }

  // Создание каштана (препятствие)
  function spawnHazard() {
    const size = 28 + Math.random() * 12;
    hazards.push({
      x: Math.random() * (W - 80) + 40,
      y: -60,
      vx: (Math.random() - 0.5) * 40,
      vy: BASE_HAZARD_SPEED + Math.random() * 70 + state.difficulty * 30,
      size, rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 5,
      alive: true
    });
  }

  // Создание частиц (взрыв при сборе листа или ударе)
  function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: 0.6 + Math.random() * 0.5,
        maxLife: 1, color,
        size: 2 + Math.random() * 4
      });
    }
  }

  // Создание фонового листа (для красоты, не влияет на геймплей)
  function spawnAmbientLeaf() {
    ambientLeaves.push({
      x: Math.random() * W, y: -20,
      vx: (Math.random() - 0.5) * 10,
      vy: 25 + Math.random() * 35,
      size: 6 + Math.random() * 8,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 2,
      color: randomLeafColor()[0],
      alpha: 0.25 + Math.random() * 0.25 // Полупрозрачные
    });
  }

  // ============================================================
  // ==== ФУНКЦИИ ОТРИСОВКИ ====
  // ============================================================
  
  // Рисуем небо, солнце и облака
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    '#2b1810'); // Темно-коричневый
    g.addColorStop(0.25, '#5c2e1c');
    g.addColorStop(0.5,  '#a4531f');
    g.addColorStop(0.72, '#e08a3c'); // Оранжевый закат
    g.addColorStop(0.88, '#f2b25e');
    g.addColorStop(1,    '#8b4a24');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Солнце (свечение + ядро)
    const sunX = W * 0.75, sunY = H * 0.32, sunR = 90;
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, sunR * 3.5);
    sunGlow.addColorStop(0, 'rgba(255, 235, 180, 0.95)');
    sunGlow.addColorStop(0.15, 'rgba(255, 200, 120, 0.6)');
    sunGlow.addColorStop(0.4, 'rgba(255, 150, 70, 0.25)');
    sunGlow.addColorStop(1, 'rgba(255, 120, 50, 0)');
    ctx.fillStyle = sunGlow;
    ctx.fillRect(0, 0, W, H);

    const sunCore = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    sunCore.addColorStop(0, 'rgba(255, 250, 220, 1)');
    sunCore.addColorStop(0.6, 'rgba(255, 210, 130, 0.9)');
    sunCore.addColorStop(1, 'rgba(255, 180, 90, 0)');
    ctx.fillStyle = sunCore;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fill();

    // Облака (мягкие эллипсы с градиентом)
    clouds.forEach(c => {
      const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.w * 0.5);
      cg.addColorStop(0, `rgba(255, 220, 180, ${c.alpha})`);
      cg.addColorStop(1, 'rgba(255, 200, 150, 0)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // Рисуем холмы на фоне
  function drawHills() {
    hills.forEach(layer => {
      ctx.beginPath();
      ctx.moveTo(0, H);
      layer.points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(W, H);
      ctx.closePath();

      const g = ctx.createLinearGradient(0, H * layer.yBase - 60, 0, H);
      g.addColorStop(0, layer.color);
      g.addColorStop(1, shade(layer.color, -0.3)); // Затемняем низ
      ctx.fillStyle = g;
      ctx.globalAlpha = layer.alpha;
      ctx.fill();
      ctx.globalAlpha = 1;

      // Тонкая подсветка контура холмов
      ctx.beginPath();
      layer.points.forEach((p, i) => {
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = 'rgba(255, 200, 130, 0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
  }

  // Рисуем деревья
  function drawBgTrees() {
    bgTrees.forEach(t => {
      // Ствол
      ctx.fillStyle = 'rgba(30, 15, 8, 0.7)';
      ctx.fillRect(t.x - 3, t.baseY - t.h, 6, t.h);

      // Крона (состоит из нескольких кругов для объема)
      const crownGrad = ctx.createRadialGradient(
        t.x, t.baseY - t.h, 0, t.x, t.baseY - t.h, t.crownR * 1.6
      );
      crownGrad.addColorStop(0, t.color);
      crownGrad.addColorStop(1, 'rgba(60, 25, 12, 0.85)');
      ctx.fillStyle = crownGrad;

      const blobs = [
        { dx: 0, dy: 0, r: t.crownR },
        { dx: -t.crownR * 0.6, dy: t.crownR * 0.3, r: t.crownR * 0.75 },
        { dx: t.crownR * 0.6, dy: t.crownR * 0.25, r: t.crownR * 0.7 },
        { dx: -t.crownR * 0.3, dy: -t.crownR * 0.5, r: t.crownR * 0.65 },
        { dx: t.crownR * 0.3, dy: -t.crownR * 0.55, r: t.crownR * 0.6 }
      ];
      blobs.forEach(b => {
        ctx.beginPath();
        ctx.arc(t.x + b.dx, t.baseY - t.h + b.dy, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  }

  // Легкий туман у земли
  function drawGroundMist() {
    const g = ctx.createLinearGradient(0, H * 0.7, 0, H);
    g.addColorStop(0, 'rgba(255, 180, 110, 0)');
    g.addColorStop(0.5, 'rgba(200, 120, 70, 0.15)');
    g.addColorStop(1, 'rgba(60, 30, 15, 0.5)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }

  // Вспомогательная функция: затемнение/осветление hex-цвета
  function shade(hex, amt) {
    const c = hex.replace('#', '');
    const num = parseInt(c, 16);
    let r = (num >> 16) & 0xff;
    let g = (num >> 8) & 0xff;
    let b = num & 0xff;
    r = Math.max(0, Math.min(255, r + amt * 255)) | 0;
    g = Math.max(0, Math.min(255, g + amt * 255)) | 0;
    b = Math.max(0, Math.min(255, b + amt * 255)) | 0;
    return `rgb(${r},${g},${b})`;
  }

  // Рисуем игровой лист (с прожилкой и свечением)
  function drawLeaf(l) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    const s = l.size;
    
    const grad = ctx.createLinearGradient(-s, -s, s, s);
    grad.addColorStop(0, l.color1);
    grad.addColorStop(1, l.color2);
    
    // Форма листа (две кривые Безье)
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.9, -s * 0.5, s * 0.9, s * 0.5, 0, s);
    ctx.bezierCurveTo(-s * 0.9, s * 0.5, -s * 0.9, -s * 0.5, 0, -s);
    ctx.fillStyle = grad;
    ctx.shadowColor = l.color1;
    ctx.shadowBlur = 12; // Свечение
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Прожилка по центру
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.8);
    ctx.lineTo(0, s * 0.8);
    ctx.strokeStyle = 'rgba(80, 30, 10, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    ctx.restore();
  }

  // Рисуем фоновый лист (простой полупрозрачный эллипс)
  function drawAmbientLeaf(a) {
    ctx.save();
    ctx.globalAlpha = a.alpha;
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.fillStyle = a.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, a.size * 0.5, a.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Рисуем каштан (коричневый круг с шипами)
  function drawHazard(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    const s = h.size;
    
    // Основа (круг с градиентом)
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
    const g = ctx.createRadialGradient(-s*0.2, -s*0.2, 2, 0, 0, s*0.6);
    g.addColorStop(0, '#8b5a2b');
    g.addColorStop(1, '#4a2c15');
    ctx.fillStyle = g;
    ctx.fill();
    
    // Шипы по кругу
    ctx.strokeStyle = '#2e1a0a';
    ctx.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5);
      ctx.lineTo(Math.cos(a) * s * 0.85, Math.sin(a) * s * 0.85);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Рисуем корзину (плетеная, с ручкой)
  function drawBasket() {
    const b = BASKET;
    ctx.save();
    ctx.translate(b.x, b.y + b.h * 0.5);
    ctx.rotate(b.tilt); // Наклоняем при движении

    // Тень под корзиной
    ctx.beginPath();
    ctx.ellipse(0, b.h * 0.55, b.w * 0.5, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // Основное тело (трапеция)
    ctx.beginPath();
    ctx.moveTo(-b.w * 0.45, -b.h * 0.4);
    ctx.lineTo(b.w * 0.45, -b.h * 0.4);
    ctx.lineTo(b.w * 0.35, b.h * 0.5);
    ctx.lineTo(-b.w * 0.35, b.h * 0.5);
    ctx.closePath();
    
    const grad = ctx.createLinearGradient(0, -b.h * 0.4, 0, b.h * 0.5);
    grad.addColorStop(0, '#c98a3a');
    grad.addColorStop(0.5, '#8b5a2b');
    grad.addColorStop(1, '#5a3a1a');
    ctx.fillStyle = grad;
    ctx.fill();

    // Плетение (горизонтальные линии)
    ctx.strokeStyle = 'rgba(60, 30, 10, 0.5)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i < 4; i++) {
      const t = i / 4;
      const y = -b.h * 0.4 + t * b.h * 0.9;
      const halfW = b.w * 0.45 - t * b.w * 0.1;
      ctx.beginPath();
      ctx.moveTo(-halfW, y);
      ctx.lineTo(halfW, y);
      ctx.stroke();
    }

    // Верхний обод (овал)
    ctx.beginPath();
    ctx.ellipse(0, -b.h * 0.4, b.w * 0.47, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#a0682d';
    ctx.fill();
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.restore();
  }

  // Рисуем частицы
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life / p.maxLife; // Плавно исчезают
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  // ==== ЛОГИКА ОБНОВЛЕНИЯ (ФИЗИКА И КОЛЛИЗИИ) ====
  // ============================================================
  function update(dt) {
    state.time += dt;

    // Двигаем облака
    clouds.forEach(c => {
      c.x += c.speed * dt;
      if (c.x - c.w > W) c.x = -c.w;
    });

    // Спавн фоновых листьев
    if (Math.random() < 0.35) spawnAmbientLeaf();
    for (let i = ambientLeaves.length - 1; i >= 0; i--) {
      const a = ambientLeaves[i];
      a.x += (a.vx + state.wind * 20) * dt;
      a.y += a.vy * dt;
      a.rot += a.rotSpeed * dt;
      // Удаляем, если улетел за нижнюю границу (75% экрана)
      if (a.y > H * 0.75) ambientLeaves.splice(i, 1);
    }

    // Логика ветра
    state.windTimer -= dt;
    if (state.windTimer <= 0) {
      state.wind = (Math.random() - 0.5) * 2; // от -1 до 1
      state.windTimer = 6 + Math.random() * 5;
      // Обновляем стрелочку в интерфейсе
      document.getElementById('windDir').textContent =
        state.wind > 0.3 ? '→' : state.wind < -0.3 ? '←' : '≈';
    }

    // Усложнение игры со временем
    state.difficulty = Math.min(3, state.time / 30); // Максимум 3
    state.spawnInterval = Math.max(0.22, 0.5 - state.difficulty * 0.08);

    // Спавн игровых объектов
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      state.spawnTimer = state.spawnInterval * (0.7 + Math.random() * 0.6);
      if (Math.random() < 0.75) spawnLeaf(); // 75% шанс на лист
      else spawnHazard();                    // 25% шанс на каштан
    }

    // Плавное движение корзины за пальцем/мышью
    BASKET.x += (BASKET.targetX - BASKET.x) * Math.min(1, dt * 16);
    BASKET.tilt = (BASKET.targetX - BASKET.x) * 0.0018; // Наклон
    BASKET.tilt = Math.max(-0.25, Math.min(0.25, BASKET.tilt)); // Ограничиваем наклон

    // Обработка игровых листьев
    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      l.swayPhase += l.swaySpeed * dt;
      
      // Движение с учетом ветра и покачивания
      l.x += (l.vx + state.wind * 80 + Math.cos(l.swayPhase) * l.swayAmp) * dt;
      l.y += l.vy * dt;
      l.rot += l.rotSpeed * dt;

      // Проверка коллизии с корзиной (AABB - прямоугольники)
      if (l.y > BASKET.y - 10 && l.y < BASKET.y + BASKET.h &&
          l.x > BASKET.x - BASKET.w * 0.5 && l.x < BASKET.x + BASKET.w * 0.5) {
        
        // Начисляем очки (базовые 10 + бонус за комбо)
        state.score += 10 + state.combo * 2;
        state.combo++;
        if (state.combo > state.bestCombo) state.bestCombo = state.combo;
        
        spawnParticles(l.x, l.y, l.color1, 12); // Эффект взрыва
        showCombo();
        updateUI();
        
        leaves.splice(i, 1); // Удаляем пойманный лист
        continue;
      }
      
      // Если лист упал на землю - сбрасываем комбо
      if (l.y > H + 60) {
        state.combo = 0;
        updateUI();
        leaves.splice(i, 1);
      }
    }

    // Обработка каштанов (препятствий)
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.x += (h.vx + state.wind * 60) * dt;
      h.y += h.vy * dt;
      h.rot += h.rotSpeed * dt;

      // Коллизия с корзиной
      if (h.y > BASKET.y - 10 && h.y < BASKET.y + BASKET.h &&
          h.x > BASKET.x - BASKET.w * 0.45 && h.x < BASKET.x + BASKET.w * 0.45) {
        
        state.lives--; // Отнимаем жизнь
        state.combo = 0; // Сбрасываем комбо
        spawnParticles(h.x, h.y, '#8b5a2b', 16);
        shakeScreen(); // Тряска экрана
        updateUI();
        
        hazards.splice(i, 1);
        if (state.lives <= 0) gameOver(); // Конец игры
        continue;
      }
      
      // Удаляем упавшие каштаны
      if (h.y > H + 60) hazards.splice(i, 1);
    }

    // Физика частиц (гравитация)
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt; // Гравитация
      p.vx *= 0.98;     // Трение
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Затухание тряски экрана
    if (shake.time > 0) {
      shake.time -= dt;
      shake.mag *= 0.9;
    }
  }

  // Объект для управления тряской экрана
  const shake = { time: 0, mag: 0 };
  function shakeScreen() {
    shake.time = 0.3;
    shake.mag = 15;
  }

  // Показ текста комбо
  let comboTimeout = null;
  function showCombo() {
    const el = document.getElementById('combo');
    if (state.combo >= 3) { // Показываем только от 3х подряд
      el.textContent = `x${state.combo} КОМБО!`;
      el.classList.add('show');
      clearTimeout(comboTimeout);
      comboTimeout = setTimeout(() => el.classList.remove('show'), 500);
    }
  }

  // Обновление цифр в интерфейсе
  function updateUI() {
    document.getElementById('score').textContent = state.score;
    document.getElementById('livesDisplay').textContent =
      '❤'.repeat(Math.max(0, state.lives)) +
      '♡'.repeat(Math.max(0, 3 - state.lives));
  }

  // ============================================================
  // ==== ГЛАВНАЯ ФУНКЦИЯ ОТРИСОВКИ КАДРА ====
  // ============================================================
  function render() {
    ctx.save();
    
    // Если активна тряска - сдвигаем весь холст
    if (shake.time > 0) {
      ctx.translate(
        (Math.random() - 0.5) * shake.mag,
        (Math.random() - 0.5) * shake.mag
      );
    }

    // Рисуем слои от дальнего к ближнему
    drawSky();
    drawHills();
    drawBgTrees();
    drawGroundMist();

    ambientLeaves.forEach(drawAmbientLeaf);
    leaves.forEach(drawLeaf);
    hazards.forEach(drawHazard);
    drawParticles();
    drawBasket();

    // Виньетка (затемнение по краям для фокуса). 
    // ВАЖНО: Рисуется внутри тряски, поэтому может немного дрожать. 
    // В идеале её вынести после ctx.restore(), но в этой версии оставлено так.
    const vg = ctx.createRadialGradient(
      W / 2, H / 2, Math.min(W, H) * 0.3,
      W / 2, H / 2, Math.max(W, H) * 0.75
    );
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(20, 8, 4, 0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.restore();
  }

  // ============================================================
  // ==== ИГРОВОЙ ЦИКЛ (Game Loop) ====
  // ============================================================
  let lastTime = 0;
  function loop(t) {
    // Вычисляем время, прошедшее с прошлого кадра (в секундах)
    // Ограничиваем до 0.05, чтобы при лагах игра не "телепортировалась"
    const dt = Math.min(0.05, (t - lastTime) / 1000) || 0;
    lastTime = t;
    
    // Обновляем физику только если игра идет и не на паузе
    if (state.running && !state.paused) update(dt);
    
    // Рисуем кадр
    render();
    
    // Запрашиваем следующий кадр
    requestAnimationFrame(loop);
  }

  // ============================================================
  // ==== УПРАВЛЕНИЕ (Мышь и Тач) ====
  // ============================================================
  
  // Установка цели для корзины (с ограничением по краям)
  function setTarget(clientX) {
    BASKET.targetX = Math.max(BASKET.w * 0.5, Math.min(W - BASKET.w * 0.5, clientX));
  }

  // Управление мышью (для ПК)
  window.addEventListener('mousemove', e => {
    if (state.running && !state.paused) setTarget(e.clientX);
  });

  // Управление пальцем (для телефонов)
  let touchActive = false;
  window.addEventListener('touchstart', e => {
    if (state.running && !state.paused) {
      touchActive = true;
      setTarget(e.touches[0].clientX);
    }
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (state.running && !state.paused && touchActive) {
      e.preventDefault(); // Блокируем скролл страницы
      setTarget(e.touches[0].clientX);
    }
  }, { passive: false });

  window.addEventListener('touchend', () => { touchActive = false; });
  window.addEventListener('touchcancel', () => { touchActive = false; });

  // Управление клавиатурой (Стрелки или A/D)
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'Escape' && state.running) togglePause();
    if (e.key === ' ' && state.running) { e.preventDefault(); togglePause(); }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // Отдельный интервал для плавного движения корзины с клавиатуры
  setInterval(() => {
    if (!state.running || state.paused) return;
    const speed = 14;
    if (keys['ArrowLeft'] || keys['a'] || keys['ф'])
      BASKET.targetX = Math.max(BASKET.w * 0.5, BASKET.targetX - speed);
    if (keys['ArrowRight'] || keys['d'] || keys['в'])
      BASKET.targetX = Math.min(W - BASKET.w * 0.5, BASKET.targetX + speed);
  }, 16);

  // ============================================================
  // ==== УПРАВЛЕНИЕ СОСТОЯНИЕМ (ПАУЗА, СТАРТ, КОНЕЦ) ====
  // ============================================================
  const pauseBtn = document.getElementById('pauseBtn');
  const overlay = document.getElementById('overlay');

  // Постановка/снятие с паузы
  function togglePause() {
    if (!state.running) return;
    state.paused = !state.paused;
    if (state.paused) {
      showPauseMenu();
      pauseBtn.textContent = '▶';
    } else {
      overlay.classList.add('hidden');
      overlay.innerHTML = '';
      pauseBtn.textContent = '⏸';
    }
  }

  // Показ меню паузы
  function showPauseMenu() {
    overlay.innerHTML = `
      <div id="pauseMenu">
        <h1>ПАУЗА</h1>
        <div class="pause-actions">
          <button id="resumeBtn">ПРОДОЛЖИТЬ</button>
          <button id="restartBtn" class="btn-secondary">НАЧАТЬ ЗАНОВО</button>
          <button id="menuBtn" class="btn-secondary">В ГЛАВНОЕ МЕНЮ</button>
        </div>
      </div>
    `;
    overlay.classList.remove('hidden');

    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    document.getElementById('restartBtn').addEventListener('click', () => {
      state.paused = false;
      pauseBtn.textContent = '⏸';
      overlay.classList.add('hidden');
      startGame();
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      state.paused = false;
      state.running = false;
      pauseBtn.textContent = '⏸';
      showMainMenu();
    });
  }

  // Показ главного меню
  function showMainMenu() {
    overlay.innerHTML = `
      <h1>ЛИСТОПАД</h1>
      <p>Лови осенние листья корзинкой.<br>
      Собирай комбо за подряд!<br>
      ⚠️ Избегай колючих каштанов —<br>они отнимают жизнь.</p>
      <p style="font-size:14px; opacity:0.7;">👆 Ведите пальцем по экрану</p>
      <button id="startBtn">НАЧАТЬ</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  // Сброс всех параметров перед новой игрой
  function resetGame() {
    state.running = true;
    state.paused = false;
    state.score = 0;
    state.lives = 3;
    state.combo = 0;
    state.bestCombo = 0;
    state.time = 0;
    state.difficulty = 0;
    state.wind = 0;
    state.windTimer = 3;
    state.spawnTimer = 0.4;
    
    // Очищаем массивы объектов
    leaves.length = 0;
    hazards.length = 0;
    particles.length = 0;
    ambientLeaves.length = 0;
    
    // Ставим корзину по центру
    BASKET.x = W / 2;
    BASKET.targetX = W / 2;
    BASKET.y = H - 150;
    
    updateUI();
    document.getElementById('windDir').textContent = '—';
  }

  // Экран проигрыша
  function gameOver() {
    state.running = false;
    overlay.innerHTML = `
      <h1>ЛИСТОПАД</h1>
      <p class="score-final">Очки: <b>${state.score}</b><br>
      Лучшее комбо: <b>x${state.bestCombo}</b></p>
      <p>${state.score > 300 ? '🍁 Настоящий мастер листопада!' :
           state.score > 150 ? '🍂 Отличный результат!' :
           '🍃 Неплохо, попробуй ещё!'}</p>
      <button id="startBtn">ЕЩЁ РАЗ</button>
      <button id="menuBtn" class="btn-secondary">В МЕНЮ</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('menuBtn').addEventListener('click', showMainMenu);
  }

  // Запуск игры
  function startGame() {
    audioEngine.start(); // Включаем музыку (требует действия пользователя)
    overlay.classList.add('hidden');
    overlay.innerHTML = '';
    pauseBtn.textContent = '⏸';
    resetGame();
  }

  // Обработчики кнопок
  pauseBtn.addEventListener('click', togglePause);

  const soundBtn = document.getElementById('soundToggle');
  soundBtn.addEventListener('click', () => {
    audioEngine.init();
    if (!audioEngine.started) {
      audioEngine.start();
    } else {
      audioEngine.toggle();
    }
    soundBtn.textContent = audioEngine.enabled ? '🔊' : '🔇';
  });

  // Инициализация корзины перед первым кадром
  BASKET.x = W / 2;
  BASKET.targetX = W / 2;
  BASKET.y = H - 150;

  // Обработчик стартовой кнопки в самом первом меню
  document.getElementById('startBtn').addEventListener('click', startGame);

  // Запускаем игровой цикл
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
